<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!--
    =====================================================================
    DESTINATION URL — CHANGE ONLY THE TWO URLs BELOW (they must match)
    =====================================================================
    • Do NOT rename or delete this GitHub Pages site. The URL is printed
      on your physical business card and encoded in its QR code.
    • Changing only the destination URL does NOT require a new QR code.
    =====================================================================
  -->

  <!-- METHOD 1: Meta refresh — fires instantly, no JS needed -->
  <meta http-equiv="refresh" content="0;url=https://maps.app.goo.gl/N3UwCvo5GwtV3sMp8">

  <!-- METHOD 2: JS redirect — fires as backup while head is still parsing -->
  <script>window.location.replace("https://maps.app.goo.gl/N3UwCvo5GwtV3sMp8");</script>

  <title>Redirecting…</title>
</head>
<body style="margin:0;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh;background:#fafafa">
  <!-- Hidden by default. Shown only if both redirects fail. -->
  <div id="fb" style="display:none;text-align:center">
    <p style="margin-bottom:1rem">Redirecting&hellip;</p>
    <a href="https://maps.app.goo.gl/N3UwCvo5GwtV3sMp8" style="padding:.75rem 1.5rem;background:#111;color:#fff;border-radius:6px;text-decoration:none">Click here if not redirected</a>
  </div>
  <script>setTimeout(function(){document.getElementById("fb").style.display="block"},3000)</script>
</body>
</html>
